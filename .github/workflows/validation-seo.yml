name: SEO Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  validate-social:
    name: Validar SEO e Open Graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validar Open Graph
        env:
          TARGET_URL: "http://pv.dcmacedo.com.br"
        run: node scripts/validate-og.js
